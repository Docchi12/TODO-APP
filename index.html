<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./images/to-do-list.png" />
    <link rel="stylesheet" href="./style/index.css" />
    <script src="./script/script.js" defer></script>
    <title>TODO-App</title>
  </head>
  <body>
    <header>
      <nav class="nav-link">
        <div class="profile">
          <div class="image-profile">
            <a href="./index.html">
              <img src="./images/profile-icon.png" alt="profile_icon" />
            </a>
          </div>
          <div class="info-user">
            <h1>Alfa</h1>
            <span>Fullstack Developer</span>
          </div>
        </div>
        <div class="datetime">
          <p class="datetime-day"></p>
          <time class="datetime-date"></time>
        </div>
      </nav>
    </header>

    <main>
      <form action="" method="post" novalidate>
        <label for="title-task">Task Name</label>
        <input
          class="title-class"
          type="text"
          id="title-task"
          name="title-task"
          placeholder="Enter the task name"
        />

        <label for="detail-task">Task Details</label>
        <textarea
          name="detail-task"
          id="detail-task"
          placeholder="Enter the task details"
        ></textarea>

        <div class="date-columns">
          <div class="date-column">
            <label for="start-date">Start Date</label>
            <input type="date" id="start-date" name="start-date" />
          </div>
          <div class="date-column">
            <label for="final-date">Final Date</label>
            <input type="date" id="final-date" name="final-date" />
          </div>
        </div>

        <div class="priority-submit">
          <fieldset class="priority-field">
            <legend>Priority level</legend>
            <div class="priority-options">
              <label>
                <input type="radio" name="priority" value="high" />
                High
              </label>
              <label>
                <input type="radio" name="priority" value="medium" />
                Medium
              </label>
              <label>
                <input type="radio" name="priority" value="low" />
                Low
              </label>
            </div>
          </fieldset>
          <button class="submit-btn" type="submit">Submit</button>
        </div>
      </form>

      <section class="TODO-section">
        <div class="header-list">
          <p>TODO List</p>
          <button>
            <img src="./images/delete.png" alt="trash icon" />
            Delete All
          </button>
        </div>
        <div class="task-list" id="task-list">
        </div>
      </section>

      <section class="finish-tasks-section">
        <div class="header-list">
          <h2>Finish Tasks</h2>
          <button class="delete-all-finished" type="button">
            <img src="./images/delete.png" alt="trash icon" />
            Delete All
          </button>
        </div>
      </section>
    </main>

    <footer>
      <p>Copyright &copy; 2026 Alfa</p>
    </footer>

    <div class="task-modal-overlay" id="task-modal" hidden>
      <section class="task-modal" role="dialog" aria-modal="true" aria-labelledby="modal-task-title">
        <button class="task-modal-close" id="modal-close" type="button" aria-label="Tutup detail task">
          &times;
        </button>
        <h2 id="modal-task-title"></h2>
        <span class="task-modal-priority" id="modal-task-priority"></span>
        <p class="task-modal-description" id="modal-task-description"></p>
        <p><strong>Start Date:</strong> <span id="modal-task-start-date"></span></p>
        <p><strong>Final Date:</strong> <span id="modal-task-final-date"></span></p>
        <p><strong>Status:</strong> <span id="modal-task-status"></span></p>
      </section>
    </div>
  </body>
</html>
